name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}

      - name: Decode keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks

      - name: Create gradle.properties for signing (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
MYAPP_RELEASE_STORE_FILE=android/keystore.jks
MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
EOF

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: Run lint
        run: |
          ./gradlew lint --no-daemon || true

      - name: Start Android emulator and run instrumentation tests (optional)
        if: ${{ secrets.RUN_INSTRUMENTED_TESTS == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -noaudio -gpu swiftshader_indirect'

      - name: Run connected Android tests (optional)
        if: ${{ secrets.RUN_INSTRUMENTED_TESTS == 'true' }}
        run: |
          ./gradlew connectedAndroidTest --no-daemon

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/**/*.apk
